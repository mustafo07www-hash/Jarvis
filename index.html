<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #111827;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.1);
        }
        header h1 { font-size: 20px; letter-spacing: 2px; color: #f8fafc; }
        .btn-icon {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-icon:hover { background: #38bdf8; color: #0b0f19; }
        
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 75%;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .jarvis-message {
            background: #0f172a;
            color: #38bdf8;
            align-self: flex-start;
            border: 1px solid #1e293b;
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
        }
        
        .input-container {
            background: #111827;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto 10px auto;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #38bdf8;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        button.action-btn {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button.action-btn:hover { background: #0ea5e9; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #111827;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #38bdf8;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 15px; color: #f8fafc; }
        .modal-content input { width: 100%; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S.</h1>
        <button class="btn-icon" onclick="openSettings()">⚙️ Sozlamalar</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message jarvis-message">Salom! Men Jarvis, sizning shaxsiy sun'iy intellekt yordamchingizman. Buyruqlaringizni bajarishga tayyorman.</div>
    </div>

    <div class="input-container">
        <button class="btn-icon" id="micBtn" onclick="toggleSpeechRecognition()" title="Ovozli buyruq">🎙️</button>
        <input type="text" id="userInput" placeholder="Buyruq kiriting..." onkeypress="handleKey(event)" />
        <button class="action-btn" onclick="sendMessage()">Yuborish</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>API Kalitni kiriting</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Groq API kalitingizni kiriting (u faqat o'z brauzeringizda saqlanadi).</p>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." />
            <button class="action-btn" style="width: 100%; padding: 12px;" onclick="saveApiKey()">Saqlash</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');

        let apiKey = localStorage.getItem('groq_api_key') || '';

        window.onload = function() {
            if (!apiKey) {
                settingsModal.style.display = 'flex';
            }
        };

        function openSettings() {
            apiKeyInput.value = apiKey;
            settingsModal.style.display = 'flex';
        }

        function saveApiKey() {
            apiKey = apiKeyInput.value.trim();
            if (apiKey) {
                localStorage.setItem('groq_api_key', apiKey);
                settingsModal.style.display = 'none';
                appendMessage("Jarvis: API kalit muvaffaqiyatli saqlandi!", 'jarvis-message');
            } else {
                alert("Iltimos, to'g'ri kalit kiriting!");
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert("Avval API kalitni kiriting!");
                openSettings();
                return;
            }

            appendMessage(text, 'user-message');
            userInput.value = '';

            const loadingId = appendMessage("O'ylayapman...", 'jarvis-message');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are J.A.R.V.I.S., a sophisticated, concise, and loyal AI assistant. Answer in Uzbek language unless asked otherwise." },
                            { role: "user", content: text }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    updateMessage(loadingId, reply);
                    speakText(reply);
                } else {
                    updateMessage(loadingId, "Xatolik: API javobi noto'g'ri formatda keldi.");
                }
            } catch (error) {
                updateMessage(loadingId, "Tarmoqda xatolik yuz berdi: " + error.message);
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerHTML = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function updateMessage(element, text) {
            element.innerHTML = text;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Brauzeringiz ovozli buyruqni qo'llab-quvvatlamaydi.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ';
            recognition.start();

            const micBtn = document.getElementById('micBtn');
            micBtn.style.background = '#ef4444';

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                userInput.value = speechToText;
                micBtn.style.background = '#1e293b';
                sendMessage();
            };

            recognition.onerror = function() {
                micBtn.style.background = '#1e293b';
            };
            
            recognition.onspeechend = function() {
                micBtn.style.background = '#1e293b';
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'uz-UZ';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
