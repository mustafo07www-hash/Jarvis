<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #111827;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        header h1 { font-size: 18px; letter-spacing: 2px; color: #f8fafc; }
        .btn-icon {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .quick-panel {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: #0f172a;
            overflow-x: auto;
            border-bottom: 1px solid #1e293b;
        }
        .quick-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .quick-btn:hover { background: #38bdf8; color: #0b0f19; }

        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-end;
        }
        .jarvis-message {
            background: #0f172a;
            color: #38bdf8;
            align-self: flex-start;
            border: 1px solid #1e293b;
        }
        
        .input-container {
            background: #111827;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto 10px auto;
            border-radius: 10px;
            border: 1px solid #1e293b;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #38bdf8;
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        button.action-btn {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #111827;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #38bdf8;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S.</h1>
        <button class="btn-icon" onclick="openSettings()">⚙️ Sozlamalar</button>
    </header>

    <div class="quick-panel">
        <button class="quick-btn" onclick="sendQuick('Salom, o\'zingni tanishtir')">👋 Salomlashish</button>
        <button class="quick-btn" onclick="sendQuick('Ajoyib HTML sahifa uchun kod yozib ber')">💻 Kod yozish</button>
        <button class="quick-btn" onclick="sendQuick('GitHub fayllarini yangilash uchun yo\'riqnoma ber')">📁 GitHub-ga yuklash</button>
        <button class="quick-btn" onclick="sendQuick('Koddagi xatoliklarni tekshirib ber')">🔍 Xatoni tekshirish</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message jarvis-message">Salom! Men Jarvisman. Serverlar va modellarga avtomatik ulanish tizimi faollashtirildi!</div>
    </div>

    <div class="input-container">
        <button class="btn-icon" id="micBtn" onclick="toggleSpeechRecognition()">🎙️</button>
        <input type="text" id="userInput" placeholder="Buyruq kiriting..." onkeypress="handleKey(event)" />
        <button class="action-btn" onclick="sendMessage()">Yuborish</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="color:#f8fafc;">Sozlamalar</h3>
            <label style="font-size:12px; color:#94a3b8;">Groq API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." />
            
            <label style="font-size:12px; color:#94a3b8;">GitHub Token (Avtomatik fayl yaratish uchun):</label>
            <input type="password" id="ghTokenInput" placeholder="ghp_..." />
            
            <label style="font-size:12px; color:#94a3b8;">GitHub Repo:</label>
            <input type="text" id="ghRepoInput" placeholder="mustafa07www-hash/Jarvis" />

            <button class="action-btn" style="padding:10px; margin-top:10px;" onclick="saveSettings()">Saqlash</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const settingsModal = document.getElementById('settingsModal');

        const models = [
            "llama-3.3-70b-versatile",
            "llama3-8b-8192",
            "mixtral-8x7b-32768"
        ];

        let apiKey = localStorage.getItem('groq_api_key') || '';
        let ghToken = localStorage.getItem('gh_token') || '';
        let ghRepo = localStorage.getItem('gh_repo') || 'mustafa07www-hash/Jarvis';

        window.onload = function() {
            if (!apiKey) openSettings();
        };

        function openSettings() {
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('ghTokenInput').value = ghToken;
            document.getElementById('ghRepoInput').value = ghRepo;
            settingsModal.style.display = 'flex';
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            ghToken = document.getElementById('ghTokenInput').value.trim();
            ghRepo = document.getElementById('ghRepoInput').value.trim();

            localStorage.setItem('groq_api_key', apiKey);
            localStorage.setItem('gh_token', ghToken);
            localStorage.setItem('gh_repo', ghRepo);

            settingsModal.style.display = 'none';
            appendMessage("Jarvis: Sozlamalar saqlandi!", 'jarvis-message');
        }

        function sendQuick(text) {
            userInput.value = text;
            sendMessage();
        }

        // UTF-8 matnlarini xavfsiz Base64 ga o'tkazish funksiyasi
        function utf8ToBase64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        async function fetchAIResponse(userText) {
            let lastError = "";

            for (let modelName of models) {
                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: modelName,
                            messages: [
                                { role: "system", content: "You are J.A.R.V.I.S., a helpful AI assistant. Respond in Uzbek language." },
                                { role: "user", content: userText }
                            ],
                            temperature: 0.7
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.choices && data.choices.length > 0) {
                        return { success: true, content: data.choices[0].message.content };
                    } else if (data.error) {
                        lastError = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }
            return { success: false, error: lastError };
        }

        async function createGitHubFile(filename, content) {
            if (!ghToken || !ghRepo) {
                return "GitHub Token kiritilmagan! Sozlamalardan Token kiriting.";
            }
            try {
                const url = `https://api.github.com/repos/${ghRepo}/contents/${filename}`;
                let sha = "";

                const getRes = await fetch(url, { headers: { 'Authorization': `token ${ghToken}` } });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Jarvis avto-fayl: ${filename}`,
                        content: utf8ToBase64(content),
                        sha: sha ? sha : undefined
                    })
                });

                if (res.ok) {
                    return `✅ GitHub'ga **${filename}** muvaffaqiyatli saqlandi!`;
                } else {
                    const err = await res.json();
                    return `❌ GitHub xatoligi: ${err.message}`;
                }
            } catch (e) {
                return `❌ Xatolik: ${e.message}`;
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert("Iltimos, avval API kalitingizni kiriting!");
                openSettings();
                return;
            }

            appendMessage(text, 'user-message');
            userInput.value = '';

            const loadingId = appendMessage("O'ylayapman (serverga ulanish)...", 'jarvis-message');

            const result = await fetchAIResponse(text);

            if (result.success) {
                updateMessage(loadingId, result.content);
                speakText(result.content);

                if ((text.toLowerCase().includes("github") || text.toLowerCase().includes("saqla")) && result.content.includes("```")) {
                    const codeMatch = result.content.match(/```(?:\w+)?\s*([\s\S]*?)```/);
                    if (codeMatch && codeMatch[1]) {
                        appendMessage("⏳ Fayl GitHub-ga yuklanmoqda...", 'jarvis-message');
                        const ghRes = await createGitHubFile("index.html", codeMatch[1].trim());
                        appendMessage(ghRes, 'jarvis-message');
                    }
                }
            } else {
                updateMessage(loadingId, "Xatolik: Server javob bermadi (" + result.error + ")");
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerHTML = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function updateMessage(element, text) {
            element.innerHTML = text;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Mikrofon qo'llab-quvvatlanmaydi.");
            const recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ';
            recognition.start();
            recognition.onresult = function(event) {
                userInput.value = event.results[0][0].transcript;
                sendMessage();
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/```[\s\S]*?```/g, 'Kod taqdim etildi.');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'uz-UZ';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
